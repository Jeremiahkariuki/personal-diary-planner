<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer glow ring -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.3" />

  <!-- Book icon background -->
  <rect x="112" y="112" width="288" height="288" rx="40" fill="url(#bookGrad)" opacity="0.25" border="1px solid rgba(255,255,255,0.1)" />

  <!-- Stylish stylized 'J' and Diary notebook motif -->
  <path d="M 288 160 C 330 160, 360 190, 360 232 L 360 300 C 360 350, 320 384, 260 384 C 200 384, 164 350, 164 300 L 164 280 C 164 268, 174 258, 186 258 C 198 258, 208 268, 208 280 L 208 296 C 208 322, 226 340, 260 340 C 294 340, 312 322, 312 296 L 312 232 C 312 208, 298 200, 276 200 C 264 200, 254 190, 254 178 C 254 166, 264 160, 288 160 Z" fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- Sparkle accent dot -->
  <circle cx="360" cy="160" r="20" fill="#f43f5e" filter="url(#glow)" />
</svg>
